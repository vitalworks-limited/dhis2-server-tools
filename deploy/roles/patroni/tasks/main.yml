---
#
# Patroni role.
#
# Runs only when dhis2_ha=true AND the host is in [databases].
# Patroni OWNS the PostgreSQL cluster - we stop and mask the OS
# postgresql service, let Patroni spin PG up as a child process, and
# manage lifecycle only through patronictl / dhis2-cluster.
#
# This role assumes the `postgres` role has already installed the PG
# binaries and extensions (postgresql_version is read from inventory
# or defaults). Patroni invokes pg_ctl against those binaries.
#

- name: Patroni | Install Python / pip prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-psycopg2
      - python3-venv
    state: present
    update_cache: true
  when: ansible_facts['os_family'] | default('') == 'Debian'

- name: Patroni | Install Patroni via pip (etcd3 extras)
  ansible.builtin.pip:
    name: "patroni{{ patroni_pip_extras }}"
    state: present
    executable: pip3
    extra_args: --break-system-packages
  # Ubuntu 24.04 requires --break-system-packages or a venv; we take
  # the --break-system-packages route and document a venv recipe in
  # the role README for operators who prefer isolation.
  notify: Restart Patroni

- name: Patroni | Create config and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ patroni_user }}"
    group: "{{ patroni_group }}"
    mode: "0750"
  loop:
    - "{{ patroni_conf_dir }}"
    - "{{ patroni_log_dir }}"

- name: Patroni | Ensure PostgreSQL data directory ownership
  ansible.builtin.file:
    path: "{{ patroni_data_dir }}"
    state: directory
    owner: "{{ patroni_user }}"
    group: "{{ patroni_group }}"
    mode: "0700"

#
# Stop and mask the OS postgresql service so Patroni can take over.
# This is the single most dangerous step in the role; it is wrapped
# in a stat guard so re-runs are no-ops.
#
- name: Patroni | Check if OS postgresql service is active
  ansible.builtin.command: systemctl is-active postgresql
  register: _os_pg_state
  changed_when: false
  failed_when: false

- name: Patroni | Stop + mask OS postgresql service (Patroni will take over)
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
    enabled: false
    masked: true
  when:
    - _os_pg_state.rc == 0
    - _os_pg_state.stdout | default('') == 'active'
  notify: Restart Patroni

- name: Patroni | Render patroni.yml
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_conf_dir }}/patroni.yml"
    owner: "{{ patroni_user }}"
    group: "{{ patroni_group }}"
    mode: "0640"
  notify: Restart Patroni

- name: Patroni | Install systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart Patroni

- name: Patroni | Open UFW for Patroni REST (localhost + HAProxy)
  ansible.builtin.ufw:
    rule: allow
    port: "{{ patroni_rest_port }}"
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] | default(item) }}"
    comment: "patroni REST from {{ item }}"
  loop: "{{ groups['pg_lb'] | default([]) + groups['databases'] }}"
  when: ansible_facts['os_family'] | default('') == 'Debian'

- name: Patroni | Open UFW for streaming replication between PG nodes
  ansible.builtin.ufw:
    rule: allow
    port: 5432
    proto: tcp
    from_ip: "{{ hostvars[item]['ansible_host'] | default(item) }}"
    comment: "pg replication from {{ item }}"
  loop: "{{ groups['databases'] + (groups['pg_lb'] | default([])) }}"
  when: ansible_facts['os_family'] | default('') == 'Debian'

- name: Patroni | Enable and start service
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true

- name: Patroni | Wait for REST API
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ patroni_rest_port }}"
    timeout: 60

- name: Patroni | Query cluster state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ patroni_rest_port }}/cluster"
    return_content: true
  register: _patroni_cluster
  changed_when: false
  failed_when: false
  retries: 10
  delay: 3
  until: _patroni_cluster.status == 200

- name: Patroni | Report cluster state
  ansible.builtin.debug:
    msg: "Patroni cluster on {{ inventory_hostname }}: {{ _patroni_cluster.json | default('(unavailable)') }}"
